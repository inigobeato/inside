<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside — LIAB Digital Studio</title>
<link rel="manifest" href="inside.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Lora:ital@0;1&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f5;--card:#fff;--ink:#2a2326;--mute:#8a7f84;--line:#eadfe0;--acc:#8a1c33;--acc2:#c24a63;--soft:#faeaee;--r:18px}
[data-acc=ocean]{--acc:#2f7fd1;--acc2:#7fb8ee;--soft:#eaf3fc}
[data-acc=forest]{--acc:#2f9a63;--acc2:#85d1a6;--soft:#e9f7ef}
[data-acc=violet]{--acc:#7a54d1;--acc2:#b79df0;--soft:#f0ebfb}
[data-acc=amber]{--acc:#d98a10;--acc2:#f3c46a;--soft:#fdf3df}
[data-mode=dark]{--bg:#000;--card:#0a0a0c;--ink:#f5f5f7;--mute:#8a8a93;--line:#1e1e23;--soft:#141418}
[data-mode=dark] #side{box-shadow:0 0 60px #000}
[data-mode=dark][data-acc=maroon]{--acc:#c2405c;--acc2:#e58a9f;--soft:#2a1419}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font:700 26px 'Playfair Display',Georgia,serif;box-shadow:0 6px 16px -6px var(--acc)}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#top b{font:700 20px 'Playfair Display',serif}
#top small{color:var(--mute);display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
#side{position:fixed;inset:0 auto 0 0;width:290px;max-width:85vw;background:var(--card);border-right:1px solid var(--line);transform:translateX(-100%);transition:.3s;z-index:20;overflow:auto;box-shadow:0 0 60px #0004}
#side.open{transform:none}
#veil{position:fixed;inset:0;background:#0006;z-index:15;display:none}#veil.on{display:block}
#ban{aspect-ratio:3/2;background-size:cover;background-position:center bottom;background-color:#000;background:linear-gradient(135deg,var(--acc),var(--acc2)) center/cover;position:relative;display:flex;align-items:flex-end;padding:14px;color:#fff;font:700 22px 'Playfair Display',serif;text-shadow:0 2px 8px #0006;cursor:pointer}
nav{padding:12px}
nav button{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border-radius:12px;text-align:left;font-weight:600;font-size:18px}
nav button:hover,nav button.on{background:var(--soft);color:var(--acc)}
nav h6{margin:14px 14px 4px;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
main{max-width:920px;margin:0 auto;padding:24px 18px 80px}
h1.t{font:700 32px 'Playfair Display',serif;margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mood{padding:14px 8px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);text-align:center;transition:.2s}
.mood:hover{transform:translateY(-3px)}
.mood.on{border-color:var(--c);box-shadow:0 0 32px -10px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.moods.pick .mood:not(.on){opacity:.45}.moods.pick .mood:not(.on):hover{opacity:1}
.mood.on .orb{box-shadow:0 0 38px 0 var(--c)}
.orb.im{border-radius:22px;width:92px;height:92px;background:var(--c)}
.orb{box-shadow:0 0 26px -6px var(--c);width:68px;height:68px;border-radius:50%;margin:0 auto 8px;background:radial-gradient(circle at 30% 25%,#fff8,transparent 45%),var(--c);display:grid;place-items:center;color:#fff;font:700 28px 'Playfair Display',serif;overflow:hidden}
.orb img{width:100%;height:100%;object-fit:cover}
.mood small{color:var(--mute);display:block;font-size:11px}
.btn{background:var(--acc);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600}
.btn.g{background:var(--soft);color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.item{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.item:hover{border-color:var(--acc)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c,var(--acc));flex:none}
.item p{color:var(--mute);font-size:13px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:60vw}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal b{font-size:11px;color:var(--mute);text-transform:uppercase}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);position:relative;background:var(--card)}
.cal button.today{border-color:var(--acc);color:var(--acc);font-weight:700}
.cal button i{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--c,var(--acc))}
.cal button:hover{background:var(--soft)}
.pr label{display:block;font:600 18px 'Playfair Display',serif;margin:14px 0 6px;color:var(--acc)}
textarea,input[type=text],input[type=password],input[type=date],select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
textarea:focus,input:focus,select:focus,#ed:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:64px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px;position:sticky;top:66px;background:var(--bg);padding:8px 0;z-index:3}
.tb select{width:auto}.tb button{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#ed{min-height:420px;padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);outline:none;line-height:1.8;font-size:17px}
#ed h1{font-size:30px;margin:.5em 0 .3em;line-height:1.2}#ed h2{font-size:22px;margin:.5em 0 .3em;color:var(--acc)}#ed p,#ed div{margin:.3em 0}
#ed:empty:before{content:attr(data-ph);color:var(--mute)}
.sw{display:flex;gap:10px}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);outline:2px solid var(--line)}.sw button.on{outline-color:var(--ink)}
.tgl{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;padding:12px 16px;border-radius:12px;background:var(--soft);font-size:17px;font-weight:600;cursor:pointer}
.sw2{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.25s}.sw2:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}.sw2.on{background:var(--acc)}.sw2.on:after{left:23px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats .card{margin:0;text-align:center}.st b{font:700 28px 'Playfair Display',serif;display:block}.st small,.bd small{color:var(--mute)}
.wk{display:flex;justify-content:space-between;gap:6px;margin-top:12px}.wk div{flex:1;text-align:center}.wk i{display:grid;place-items:center;height:42px;border-radius:50%;border:2px dashed var(--line);font-style:normal;margin-bottom:4px}.wk .on i{border:2px solid var(--acc);background:var(--soft)}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.bd{padding:16px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);text-align:center;display:flex;flex-direction:column;gap:4px;filter:grayscale(1);opacity:.6}
.bd.ok{filter:none;opacity:1;border-color:var(--acc);box-shadow:0 0 26px -12px var(--acc)}.bi{font-size:34px}.pb{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--acc)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:22px 14px;margin-top:24px}.cm{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.cm small{color:var(--mute)}
.gl{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffa,var(--c) 42%,color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 0 38px -2px var(--c);animation:fl 4s ease-in-out infinite;transition:.2s}.cm:hover .gl{transform:scale(1.1)}
@keyframes fl{50%{transform:translateY(-6px);box-shadow:0 0 52px 2px var(--c)}}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;place-items:center;text-align:center}
#lock.on{display:grid}#lock input{text-align:center;letter-spacing:.5em;font-size:24px;width:220px;margin:18px 0 10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:100}#toast.on{opacity:1}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
@media(min-width:1100px){#side{transform:none}#top,main{margin-left:290px}#top{margin-left:290px}#menu,#veil{display:none!important}main{max-width:900px;margin-left:calc(290px + (100vw - 290px - 900px)/2)}}
</style>
</head>
<body>
<div id="lock"><div><div class="logo" style="margin:auto;width:64px;height:64px;font-size:40px">I</div><h1 class="t" style="margin-top:14px">Inside</h1><p class="sub">Enter your PIN to open your journal</p><input id="lp" type="password" inputmode="numeric" maxlength="12"><br><button class="btn" id="lgo">Unlock</button></div></div>
<div id="veil"></div>
<aside id="side"><div id="ban" title="Tap to change image">Inside</div><nav id="nav"></nav><input type="file" id="bf" accept="image/*" hidden></aside>
<header id="top"><button class="ib" id="menu">☰</button><div class="logo">I</div><div><b>Inside</b><small>LIAB Digital Studio</small></div><span class="sp"></span><button class="ib" id="dm" title="Dark mode">🌙</button></header>
<main id="main"></main>
<div id="toast"></div>

<script>

let db=JSON.parse(localStorage.getItem(K)||'null')||{e:[],m:{},s:{acc:'maroon',mode:'dark',black:1,font:0,pin:'',img:{},banner:''}};
if(!db.s.black){db.s.black=1;db.s.mode='dark'}
if(db.s.acc==='rose')db.s.acc='maroon';

const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()),mc=id=>MOODS.find(m=>m[0]===id);
const fmt=s=>new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});

const strip=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('inside'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'inside'+s)h=h*33^c.charCodeAt(0);return 'f'+(h>>>0)}}
function img(file,size,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,size/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/webp',.85))};i.src=r.result};r.readAsDataURL(file)}
const orb=m=>{const u=db.s.img[m[0]]||(window.INSIDE_IMG||{})[m[0]];return `<div class="orb${u?' im':''}" style="--c:${m[2]}">${u?`<img src="${u}" alt="${m[1]}">`:m[1][0]}</div>`}
function theme(){document.documentElement.dataset.acc=db.s.acc;document.documentElement.dataset.mode=db.s.mode;$('#dm').textContent=db.s.mode==='dark'?'☀️':'🌙';const bi=db.s.banner||window.INSIDE_BANNER;$('#ban').style.backgroundImage=bi?`url(${bi}),linear-gradient(135deg,var(--acc),var(--acc2))`:'';$('#ban').textContent=bi?'':'Inside'}
const dset=()=>new Set(db.e.map(e=>e.date)),addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return ymd(x)};
function st(){const S=dset();let cur=0,d=S.has(today())?today():addD(today(),-1);while(S.has(d)){cur++;d=addD(d,-1)}let best=0,run=0,pv=null;for(const x of [...S].sort()){run=pv&&addD(pv,1)===x?run+1:1;best=Math.max(best,run);pv=x}return{cur,best,set:S}}
const words=()=>db.e.reduce((n,e)=>n+strip([e.a1,e.a2,e.a3,e.body].join(' ')).trim().split(/\s+/).filter(Boolean).length,0),cnt=c=>db.e.filter(e=>e.cat===c).length,bst=()=>st().best;
const BAD=[['🌱','First Page','Write your first entry',()=>db.e.length,1],['🔥','3-Day Spark','Journal 3 days in a row',bst,3],['⭐','7-Day Streak','Journal 7 days in a row',bst,7],['🌙','14-Day Habit','Journal 14 days in a row',bst,14],['🏅','30-Day Streak','Journal 30 days in a row',bst,30],['💎','60-Day Devotion','Journal 60 days in a row',bst,60],['👑','100-Day Legend','Journal 100 days in a row',bst,100],['🏆','365-Day Year','A full year of journaling',bst,365],
['📚','10 Entries','Write 10 entries',()=>db.e.length,10],['📖','50 Entries','Write 50 entries',()=>db.e.length,50],['🗂️','100 Entries','Write 100 entries',()=>db.e.length,100],
['🎯','5 Milestones','Log 5 milestones',()=>cnt('Milestones'),5],['🚀','10 Milestones','Log 10 milestones',()=>cnt('Milestones'),10],
['🔮','First Core Memory','Save a core memory',()=>cnt('Core Memories'),1],['✨','5 Core Memories','Save 5 core memories',()=>cnt('Core Memories'),5],['🌈','10 Core Memories','Save 10 core memories',()=>cnt('Core Memories'),10],
['🗝️','Secret Keeper','Write 5 deep secrets',()=>cnt('Deep Secrets'),5],['🎭','Full Spectrum','Feel all 10 emotions',()=>new Set([...Object.values(db.m),...db.e.map(e=>e.mood)].filter(Boolean)).size,10],['😊','Mood Tracker','Check in your mood 7 days',()=>Object.keys(db.m).length,7],
['✍️','1,000 Words','Write 1,000 words',words,1000],['📝','10,000 Words','Write 10,000 words',words,10000],['🔒','Locked In','Set a PIN',()=>db.s.pin?1:0,1],['💾','Safe & Sound','Back up your journal',()=>db.s.bk||0,1]];
function chk(){const u=db.s.ub||(db.s.ub=[]);BAD.forEach(b=>{if(b[3]()>=b[4]&&!u.includes(b[1])){u.push(b[1]);save();toast('🏆 Unlocked: '+b[1])}})}
let view='dash',cur=null,cm=new Date();
function nav(){$('#nav').innerHTML=`<div class="tgl" id="sdm"><span>${db.s.mode==='dark'?'🌙 Dark mode':'☀️ Light mode'}</span><i class="sw2 ${db.s.mode==='dark'?'on':''}"></i></div><button data-v="dash">🏠 Dashboard</button><button data-v="cal">📅 Calendar</button><button data-v="streak">🔥 Streaks & Rewards</button><button data-v="core">🔮 Core Memories</button><h6>Categories</h6>${CATS.map(c=>`<button data-v="cat:${c[0]}">${c[1]} ${c[0]}</button>`).join('')}<h6>System</h6><button data-v="set">⚙️ Settings & Backup</button><p class="foot">© LIAB Digital Studio</p>`;
document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.v===view||(cur&&(b.dataset.v==='cat:'+cur.cat||(cur.cat==='Core Memories'&&b.dataset.v==='core'))))b.classList.add('on');b.onclick=()=>go(b.dataset.v)});
$('#sdm').onclick=()=>{db.s.mode=db.s.mode==='dark'?'light':'dark';save();render()}}
function go(v){view=v;cur=null;closeSide();render()}
function closeSide(){$('#side').classList.remove('open');$('#veil').classList.remove('on')}
$('#menu').onclick=()=>{$('#side').classList.add('open');$('#veil').classList.add('on')};$('#veil').onclick=closeSide;

if(!e){e={id:Date.now(),date,cat,mood:db.m[date]||'',title:'',a1:'',a2:'',a3:'',body:''};db.e.push(e)}cur=e;view='ed';render()}

if(view==='dash'){const t=today(),sel=db.m[t],nm=db.s.name;
const rec=[...db.e].sort((a,b)=>b.id-a.id).slice(0,4);
M.innerHTML=`<h1 class="t">Hey, ${nm?esc(nm):'there'}</h1><p class="sub">${fmt(t)}</p>${nm?'':'<div class="card"><b>What should I call you?</b><div class="row" style="margin-top:10px"><input type="text" id="nn" maxlength="24" placeholder="Your nickname" style="flex:1;min-width:160px"><button class="btn" id="nb">Save</button></div></div>'}<div class="card"><h3 style="margin-bottom:4px;font-family:'Playfair Display',serif">Who's running the show today?</h3><p class="sub" style="margin-bottom:14px">Pick the feeling that's in control right now.</p><div class="moods ${sel?'pick':''}">${MOODS.map(m=>`<button class="mood ${sel===m[0]?'on':''}" style="--c:${m[2]}" data-m="${m[0]}">${orb(m)}<b>${m[1]}</b></button>`).join('')}</div></div>
<div class="row" style="margin-bottom:22px"><button class="btn" id="wr">✍️ Write today's entry</button><button class="btn g" onclick="go('cal')">📅 Open calendar</button></div>
<h3 style="margin-bottom:10px;font-family:'Playfair Display',serif">Recent</h3>${rec.length?rec.map(itemH).join(''):'<p class="sub">Nothing yet. Your first page is waiting.</p>'}`;
M.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{db.m[t]=b.dataset.m;const e=db.e.find(x=>x.date===t&&x.cat==='Diary');if(e)e.mood=b.dataset.m;save();render();toast('Mood set: '+mc(b.dataset.m)[1])});
$('#wr').onclick=()=>openEntry(t,'Diary');bindItems();if($('#nb')){const f=()=>{const v=$('#nn').value.trim();if(v){db.s.name=v;save();render()}};$('#nb').onclick=f;$('#nn').onkeydown=e=>e.key==='Enter'&&f()}}
else if(view==='cal'){const y=cm.getFullYear(),mo=cm.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();let c='';
['S','M','T','W','T','F','S'].forEach(d=>c+=`<b>${d}</b>`);for(let i=0;i<first;i++)c+='<span></span>';
for(let d=1;d<=n;d++){const k=y+'-'+pad(mo+1)+'-'+pad(d),mm=mc(db.m[k]),has=db.e.some(e=>e.date===k);c+=`<button data-d="${k}" class="${k===today()?'today':''}">${d}${has||mm?`<i style="--c:${mm?mm[2]:'var(--acc)'}"></i>`:''}</button>`}
M.innerHTML=`<h1 class="t">Calendar</h1><p class="sub">Tap a day to read or write. Dots show mood and entries.</p><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px"><button class="ib" id="pm">‹</button><b style="font:700 20px 'Playfair Display',serif">${cm.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="ib" id="nm">›</button></div><div class="cal">${c}</div></div><div id="dl"></div>`;
$('#pm').onclick=()=>{cm=new Date(y,mo-1,1);render()};$('#nm').onclick=()=>{cm=new Date(y,mo+1,1);render()};
M.querySelectorAll('.cal button').forEach(b=>b.onclick=()=>{const k=b.dataset.d,es=db.e.filter(e=>e.date===k);$('#dl').innerHTML=`<h3 style="margin-bottom:10px;font-family:'Playfair Display',serif">${fmt(k)}</h3>${es.map(itemH).join('')}<div class="row"><button class="btn" id="nd">+ Diary entry</button></div>`;$('#nd').onclick=()=>openEntry(k,'Diary');bindItems()})}
else if(view.startsWith('cat:')){const cat=view.slice(4),es=db.e.filter(e=>e.cat===cat).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
M.innerHTML=`<h1 class="t">${CATS.find(c=>c[0]===cat)[1]} ${cat}</h1><p class="sub">${es.length} entr${es.length==1?'y':'ies'}</p><button class="btn" id="ne" style="margin-bottom:18px">+ New ${cat} entry</button>${es.map(itemH).join('')}`;
$('#ne').onclick=()=>{db.e.push(cur={id:Date.now(),date:today(),cat,mood:db.m[today()]||'',title:'',a1:'',a2:'',a3:'',body:''});view='ed';render()};bindItems()}
else if(view==='streak'){const S=st(),days=[0,1,2,3,4,5,6].map(i=>addD(today(),i-6)),n=BAD.filter(b=>b[3]()>=b[4]).length;
M.innerHTML=`<h1 class="t">Streaks & Rewards</h1><p class="sub">Write every day to keep the flame alive.</p><div class="stats"><div class="card st"><b>🔥 ${S.cur}</b><small>Current streak</small></div><div class="card st"><b>🏆 ${S.best}</b><small>Best streak</small></div><div class="card st"><b>📖 ${db.e.length}</b><small>Entries</small></div><div class="card st"><b>✍️ ${words()}</b><small>Words</small></div></div><div class="card" style="margin-top:18px"><h3>This week</h3><div class="wk">${days.map(d=>`<div class="${S.set.has(d)?'on':''}"><i>${S.set.has(d)?'🔥':''}</i><small>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short'})}</small></div>`).join('')}</div></div><h3 style="margin:6px 0 12px;font-family:'Playfair Display',serif">Rewards · ${n}/${BAD.length} unlocked</h3><div class="bg">${BAD.map(b=>{const v=Math.min(b[3](),b[4]);return `<div class="bd ${v>=b[4]?'ok':''}"><div class="bi">${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small><div class="pb"><i style="width:${v/b[4]*100}%"></i></div><small>${v}/${b[4]}</small></div>`}).join('')}</div>`}
else if(view==='core'){const es=db.e.filter(e=>e.cat==='Core Memories').sort((a,b)=>b.date.localeCompare(a.date));
M.innerHTML=`<h1 class="t">🔮 Core Memories</h1><p class="sub">The moments that shape who you are. Each orb glows in the color of the emotion behind it.</p><button class="btn" id="nc">+ New core memory</button><div class="shelf">${es.map(e=>{const m=mc(e.mood);return `<button class="cm" data-id="${e.id}" style="--c:${m?m[2]:'var(--acc)'}"><span class="gl"></span><b>${esc(e.title)||'Untitled memory'}</b><small>${m?m[1]+' · ':''}${new Date(e.date+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</small></button>`}).join('')}</div>${es.length?'':'<p class="sub" style="margin-top:24px">No core memories yet. What moment do you never want to forget?</p>'}`;
$('#nc').onclick=()=>{db.e.push(cur={id:Date.now(),date:today(),cat:'Core Memories',mood:db.m[today()]||'joy',title:'',a1:'',a2:'',a3:'',body:''});view='ed';render()};
M.querySelectorAll('.cm').forEach(b=>b.onclick=()=>{cur=db.e.find(x=>x.id==b.dataset.id);view='ed';render()})}
else if(view==='ed')editor(M);
else settings(M)}
function itemH(e){const m=mc(e.mood);return `<button class="item" data-id="${e.id}"><span class="dot" style="--c:${m?m[2]:'var(--acc)'}"></span><div><b>${esc(e.title)||e.cat+' · '+e.date}</b><p>${fmt(e.date)} · ${e.cat}${m?' · '+m[1]:''} — ${esc(strip(e.body||e.a2||e.a1).slice(0,80))}</p></div></button>`}
function bindItems(){document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const e=db.e.find(x=>x.id==b.dataset.id);cur=e;view='ed';render()})}
function editor(M){const e=cur,d=e.cat==='Diary',m=mc(e.mood);
M.innerHTML=`<div class="row" style="justify-content:space-between"><button class="btn g" id="bk">← Back</button><span class="sub" id="sv" style="margin:0">Autosaves</span></div>
<h1 class="t" style="margin-top:16px">${e.cat==='Diary'?'Dear Diary':e.cat}</h1><p class="sub">${fmt(e.date)}${m?` · feeling <b style="color:${m[2]}">${m[1]}</b>`:''}</p>
<div class="card"><input type="text" id="ti" placeholder="Title (optional)" value="${esc(e.title)}"><div class="row" style="margin-top:10px"><input type="date" id="dt" value="${e.date}" style="width:auto"><select id="cs" style="width:auto">${MOODS.map(x=>`<option value="${x[0]}" ${x[0]===e.mood?'selected':''}>${x[1]}</option>`).join('')}</select></div>
${d?`<div class="pr"><label>Anyari Today?</label><textarea id="a1" placeholder="What happened today…">${esc(e.a1)}</textarea><label>Kamusta ka?</label><textarea id="a2" placeholder="How are you, really?">${esc(e.a2)}</textarea><label>Kaya pa ba?</label><textarea id="a3" placeholder="Can you still carry on? Be honest.">${esc(e.a3)}</textarea></div>`:''}</div>
<h3 style="font-family:'Playfair Display',serif">Free writing</h3>
<div class="tb"><select id="bl"><option value="p">Body text</option><option value="h1">Heading</option><option value="h2">Subheading</option></select><select id="fs">${FONTS.map((f,i)=>`<option value="${i}" ${i==db.s.font?'selected':''}>${f[0]}</option>`).join('')}</select><button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button></div>
<div id="ed" contenteditable="true" data-ph="Write freely. No rules, no judgment — this is just for you…" style="font-family:${FONTS[db.s.font][1]}">${e.body}</div>
<div class="row" style="margin-top:18px"><button class="btn g" id="dx">⬇ Export this entry</button><button class="btn g" id="del" style="color:#d33">Delete</button></div>`;
let t;const sv=()=>{clearTimeout(t);t=setTimeout(()=>{e.title=$('#ti').value;e.date=$('#dt').value||e.date;e.mood=$('#cs').value;if(d){e.a1=$('#a1').value;e.a2=$('#a2').value;e.a3=$('#a3').value}e.body=$('#ed').innerHTML;if(e.mood)db.m[e.date]=e.mood;save();chk();$('#sv').textContent='Saved ✓'},400);$('#sv').textContent='Saving…'};
M.querySelectorAll('input,textarea,#cs').forEach(x=>x.oninput=sv);$('#ed').oninput=sv;
$('#bl').onchange=ev=>{$('#ed').focus();document.execCommand('formatBlock',false,ev.target.value);sv()};
$('#fs').onchange=ev=>{db.s.font=+ev.target.value;$('#ed').style.fontFamily=FONTS[db.s.font][1];save()};
M.querySelectorAll('.tb button').forEach(b=>b.onmousedown=ev=>{ev.preventDefault();document.execCommand(b.dataset.c);sv()});
$('#bk').onclick=()=>{if(!e.title&&!e.a1&&!e.a2&&!e.a3&&!strip(e.body).trim()&&!$('#ed').textContent.trim())db.e=db.e.filter(x=>x!==e);save();go(e.cat==='Diary'?'dash':e.cat==='Core Memories'?'core':'cat:'+e.cat)};
$('#del').onclick=()=>{if(confirm('Delete this entry?')){db.e=db.e.filter(x=>x!==e);save();go('dash')}};
$('#dx').onclick=()=>dl(e.date+'-'+e.cat+'.txt',txt([e]),'text/plain')}
const txt=es=>es.map(e=>`${fmt(e.date)} — ${e.cat}${e.mood?' ('+mc(e.mood)[1]+')':''}\n${e.title?e.title+'\n':''}${e.a1?'\nAnyari Today?\n'+e.a1+'\n':''}${e.a2?'\nKamusta ka?\n'+e.a2+'\n':''}${e.a3?'\nKaya pa ba?\n'+e.a3+'\n':''}\n${strip(e.body.replace(/<\/(p|div|h1|h2)>/g,'\n'))}\n\n----------\n`).join('\n');
function dl(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function settings(M){const s=db.s;
M.innerHTML=`<h1 class="t">Settings & Backup</h1><p class="sub">Your journal lives only in this browser. Back it up regularly.</p>
<div class="card"><h3>Your nickname</h3><p class="sub">Shown in your dashboard greeting.</p><div class="row"><input type="text" id="sn" maxlength="24" placeholder="Nickname" value="${esc(s.name)}" style="flex:1;min-width:160px"><button class="btn" id="snb">Save</button></div></div>
<div class="card"><h3>Appearance</h3><p class="sub">Dark mode via the 🌙 button on top. Pick an accent:</p><div class="sw">${THEMES.map(t=>`<button data-a="${t[0]}" class="${s.acc===t[0]?'on':''}" style="background:${t[1]}" title="${t[0]}"></button>`).join('')}</div></div>
<div class="card"><h3>PIN protection</h3><p class="sub">${s.pin?'PIN is ON. Inside will ask for it each time it opens.':'No PIN set.'}</p><div class="row"><button class="btn" id="sp">${s.pin?'Change PIN':'Set PIN'}</button>${s.pin?'<button class="btn g" id="rp">Remove PIN</button>':''}</div></div>
<div class="card"><h3>Backup & export</h3><p class="sub">Full backup includes entries, moods, settings and images.</p><div class="row"><button class="btn" id="eb">⬇ Backup (.json)</button><button class="btn g" id="ib">⬆ Restore backup</button><button class="btn g" id="et">📄 Export all as text</button></div><input type="file" id="rf" accept=".json" hidden></div>
<div class="card"><h3>Character images</h3><p class="sub">Upload your own artwork for each character (stored privately in your browser).</p><div class="moods">${MOODS.map(m=>`<label class="mood" style="--c:${m[2]};cursor:pointer">${orb(m)}<b>${m[1]}</b><small>tap to replace</small><input type="file" accept="image/*" hidden data-i="${m[0]}"></label>`).join('')}</div>${Object.keys(s.img).length?'<button class="btn g" id="ci" style="margin-top:14px">Reset images</button>':''}</div>
<p class="foot">Inside · a LIAB Digital Studio product</p>`;
$('#snb').onclick=()=>{s.name=$('#sn').value.trim();save();toast('Nickname saved')};
M.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{s.acc=b.dataset.a;save();render()});
$('#sp').onclick=async()=>{const p=prompt('Enter a new PIN (4–12 digits)');if(p&&/^\d{4,12}$/.test(p)){s.pin=await hash(p);save();chk();toast('PIN saved');render()}else if(p)toast('PIN must be 4–12 digits')};
if($('#rp'))$('#rp').onclick=async()=>{const p=prompt('Enter current PIN to remove');if(p&&await hash(p)===s.pin){s.pin='';save();render()}else if(p)toast('Wrong PIN')};
$('#eb').onclick=()=>{db.s.bk=1;save();chk();dl('Inside-backup-'+today()+'.json',JSON.stringify(db),'application/json')};
$('#et').onclick=()=>dl('Inside-journal-'+today()+'.txt',txt([...db.e].sort((a,b)=>a.date.localeCompare(b.date))),'text/plain');
$('#ib').onclick=()=>$('#rf').click();
$('#rf').onchange=ev=>{const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.e||!n.s)throw 0;if(confirm('Replace current journal with this backup?')){db=n;save();theme();render();toast('Restored')}}catch(x){toast('Invalid backup file')}};r.readAsText(ev.target.files[0])};
M.querySelectorAll('[data-i]').forEach(i=>i.onchange=ev=>ev.target.files[0]&&img(ev.target.files[0],220,d=>{s.img[i.dataset.i]=d;save();render()}));
if($('#ci'))$('#ci').onclick=()=>{s.img={};save();render()}}
async function tryUnlock(){if(await hash($('#lp').value)===db.s.pin){$('#lock').classList.remove('on');$('#lp').value=''}else{toast('Wrong PIN');$('#lp').value=''}}
$('#lgo').onclick=tryUnlock;$('#lp').onkeydown=e=>e.key==='Enter'&&tryUnlock();
if(db.s.pin)$('#lock').classList.add('on');
theme();render();
const h0=location.hash.slice(1);if(['streak','core','cal'].includes(h0)){view=h0;render()}
</script>
</body>
</html>
